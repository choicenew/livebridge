name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: livebridge-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  check-signing:
    runs-on: ubuntu-latest
    outputs:
      has-secret: ${{ steps.check.outputs.has-secret }}
    steps:
      - id: check
        env:
          KEYSTORE_B64: ${{ secrets.LIVEBRIDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has-secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secret=false" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    runs-on: ubuntu-latest
    needs: check-signing
    # Only runs once the signing secrets below are added in this repo's
    # Settings -> Secrets and variables -> Actions -> Secrets. Until then
    # it's skipped (not failed), so it won't break CI for anyone who hasn't
    # set it up yet.
    if: needs.check-signing.outputs.has-secret == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          mkdir -p android/keystores
          echo "${{ secrets.LIVEBRIDGE_KEYSTORE_BASE64 }}" | base64 -d > android/keystores/release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=keystores/release.jks
          storePassword=${{ secrets.LIVEBRIDGE_STORE_PASSWORD }}
          keyAlias=${{ secrets.LIVEBRIDGE_KEY_ALIAS }}
          keyPassword=${{ secrets.LIVEBRIDGE_KEY_PASSWORD }}
          EOF

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64-v8a APK (Samsung / most modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: livebridge-release-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK (older 32-bit devices)
        uses: actions/upload-artifact@v4
        with:
          name: livebridge-release-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK (emulators)
        uses: actions/upload-artifact@v4
        with:
          name: livebridge-release-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
